name: AdminAbuse
version: 1.0.0
main: id.adminabuse.AdminAbusePlugin
api-version: '26.1'
description: Boss bar timer hitung mundur 15 menit untuk event admin abuse
commands:
  adminabuse:
    description: Mulai timer admin abuse (15 menit). Pakai "/adminabuse stop" untuk menghentikan.
    usage: /adminabuse [stop]
    aliases: [adminabiuse]
    permission: adminabuse.use
permissions:
  adminabuse.use:
    description: Boleh memakai /adminabuse
    default: op
